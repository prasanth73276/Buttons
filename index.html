<!DOCTYPE html>
<html>
<head>
    <title>HTML CSS Course</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .tahoma {
            font-family: Tahoma;
            font-weight: bold;
            font-size: 20px;
        }

        h2 {
            font-family: Arial;
            font-size: 24px;
            margin-bottom: 0;
        }

        .beginner {
            font-family: Arial;
            color: #666;
            font-size: 20px;
            margin-top: 5px;
        }

        .description {
            font-family: Arial;
            font-size: 24px;
            line-height: 32px;
            margin-top: 45px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        body > h1 {
            font-family: Arial;
            font-size: 40px;
            margin-top: 45px;
        }

        .sales {
            font-family: Georgia;
            font-size: 20px;
        }

        .apple {
            text-align: center;
            margin-top: 140px;
            font-family: Arial;
        }

        .apple h1 {
            font-size: 60px;
            margin-bottom: 35px;
        }

        .apple p {
            font-size: 36px;
            margin-bottom: 35px;
        }

        .apple a {
            font-size: 30px;
            color: #1683e8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <p class="tahoma">This is Tahoma Font</p>

    <h2>HTML CSS Course</h2>
    <p class="beginner">Beginner to Pro</p>

    <p class="description">
        In this course, we'll learn the skills<br>
        you need to become developer.
    </p>

    <button>Get Started</button>

    <h1>Biggest Deals of the Year!</h1>
    <p class="sales">Sales end Tuesday</p>

    <div class="apple">
        <h1>Shopping for your business?</h1>
        <p>See how Apple at work can help.</p>
        <a href="#">Learn more &gt;</a>
    </div>

</body>
</html>
